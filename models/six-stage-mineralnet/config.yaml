# Run configuration. Paths are relative to the repository root.
#
# NOTE: the model horizon (regions + years) currently lives in
# data/raw/input_data_3region/index.csv, which the notebook reads directly.
# It is repeated here for the future scripts/run_all.py entry point; keep the
# two in sync, or make index.csv the single source once the package exists.

data_dir: data/raw/input_data_3region

horizon:
  regions: [US, CHN, AUS]
  years: [2026, 2036]        # inclusive range

solver:
  name: gurobi
  mip_gap: 0.0
  time_limit_s: null
