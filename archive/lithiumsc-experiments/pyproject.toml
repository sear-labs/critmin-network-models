[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lithiumsc-experiments"
version = "0.0.1"
description = "Archive of experimental lithium supply-chain formulations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gurobipy>=11,<13",
    "pandas>=2,<3",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4,<5",
    "nbstripout>=0.7,<1",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
