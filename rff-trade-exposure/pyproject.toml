[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "critmin-tradeexposure"
version = "0.0.1"
description = "Critical mineral trade and import-exposure analysis (RFF Critical Mineral Lab)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2,<3",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4,<5",
    "nbstripout>=0.7,<1",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# notebooks/ are exploratory narrative and are not held to module style.
# That is not what CI is guarding.
extend-exclude = ["notebooks"]
